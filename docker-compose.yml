version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: akademie_db
    environment:
      POSTGRES_DB: akademie_trutnov
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akademie_trutnov"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akademie_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=PostgreSql
      - ConnectionStrings__PostgresConnection=Host=db;Port=5432;Database=akademie_trutnov;Username=postgres;Password=postgres
    ports:
      - "5000:8080"
    restart: unless-stopped

volumes:
  postgres_data:
